# Continuous integration: build, test, scan, and the gate that decides whether a change may merge.
# Everything this file does is explained here; the workflow below is the steps themselves.
#
#
# THE JOB NAMES ARE LOAD-BEARING, NOT COSMETIC
#
# Task #24. Branch protection on `main` requires three exact check names before a merge is allowed:
# "Backend (.NET)", "Frontend (React)" and "Container image build". SonarCloud Code Analysis stays
# advisory and non-required, per this project's own coverage-ratchet standard. Renaming a job here
# without updating branch protection's required-check list breaks the gate silently: the old name
# stops reporting, and GitHub treats a check that never runs as pending forever rather than as a
# failure. So a rename can turn "required" into "blocks every PR forever" or, if the name is dropped
# from the required list at the same time, into no protection at all. Renaming a job is a
# branch-protection change, not only a workflow edit.
#
#
# THE fast-checks JOB
#
# Task #24 addendum. The fast half of the backend's checks, duplicated into their own job so a
# compile error or a broken unit test reports in about ninety seconds instead of the eight minutes
# the `backend` job takes.
#
# Duplication rather than extraction, on purpose. The unit and architecture suites cannot simply move
# out of `backend`: their coverage reports have to be written on disk beside `sonar end`, which is why
# MSP-70 pulled the integration suite back into that job in the first place. Moving them would delete
# their contribution to the coverage the quality gate enforces, a gate weakening dressed up as a
# speed-up. So this job re-runs them WITHOUT coverage, purely for the signal, and `backend` still runs
# them exactly as before for the measurement.
#
# Deliberately not a required check: it proves a subset of what "Backend (.NET)" proves, so requiring
# it would add a second thing to keep green without adding a second thing being checked. Its value is
# the latency of the failure, not the failure itself.
#
#
# THE backend JOB
#
# `fetch-depth: 0` because Sonar needs history for new-code and blame attribution.
#
# Node lives in this job too, because frontend coverage has to be produced beside the scanner
# (MSP-70). It is the same version as the `frontend` job: two different Node versions producing the
# analysed artifacts would be its own quiet source of drift.
#
# Sonar is gated on SONAR_TOKEN so a fork still builds normally. MSP-78: SonarCloud never analysed C#
# here at all, because Automatic Analysis cannot - it needs the MSBuild scanner wrapping the build.
#
# MSP-98 puts continue-on-error on every Sonar-owned step. `Sonar begin` fetches the quality profile
# from sonarcloud.io before anything is compiled, and when that call returned 5xx during PR #90 the
# scanner aborted unhandled with exit 134 and reddened the REQUIRED "Backend (.NET)" check in 45
# seconds, twice, before a single test ran. A required gate a third party can fail is not a gate on
# this repository's code. The analysis is not weakened: every step still runs, still reports, and
# SonarCloud Code Analysis remains a visible non-required check. What changes is only whether a
# SonarCloud outage can fail the build.
#
# DEPENDENCY SCAN (.NET), NFR-SEC-011 via MSP-70. Until this existed the build printed "NU1902
# OpenTelemetry.Api 1.11.2 has a known moderate vulnerability" on every run and CI went green anyway:
# a scanner nobody could fail. It fails on high and critical only. Moderate is reported but not
# blocking, deliberately, because a gate that fires on every transitive moderate advisory gets
# switched off within a fortnight, and a gate that is off is worth less than one calibrated to what
# will actually be acted on. Moderates still surface in the log and in MSP-80's triage.
# `--include-transitive` because the advisory that prompted this was transitive: OpenTelemetry.Api
# arrived through three direct OpenTelemetry packages and would have been invisible to a direct-only
# scan.
#
# A scan that did not run must not read as a clean scan. Found while testing this gate: adding a
# deliberately vulnerable package broke restore with NU1605, `dotnet list` produced no findings
# because it had no assets to inspect, and a naive grep reported "no high or critical" - a green gate
# over an unscanned tree. That is the same shape as every other defect in this arc, absence of a
# signal presenting as a good signal. So the step asserts the scan actually enumerated projects before
# trusting that it found nothing.
#
# DEPENDENCY SCAN (npm). Task #20/MSP-80 AC1, run for real. @lhci/cli is back, for the Lighthouse LCP
# measurement in the frontend job, and brought its findings with it, re-confirmed fresh rather than
# reused. Every one is still a transitive of @lhci/cli, which is still at 0.15.1, the latest published
# version, unchanged since PR #8 first found this, with `npm audit fix` offering only a semver-major
# downgrade to 0.1.0 as its "fix".
#
# It reduces to two actual CVEs rather than seven independent ones, because npm audit propagates a
# dependency's worst transitive severity up the whole chain: five of the seven "high" entries
# (@lhci/cli, @lhci/utils, @puppeteer/browsers, lighthouse, puppeteer-core) carry no CVE of their own
# and are high only because they depend on extract-zip (GHSA-jmr9-qjv8-65gv, unvalidated symlink path
# traversal during archive extraction) and tmp (GHSA-52f5-9888-hmc6 and GHSA-ph9p-34f9-6g65, arbitrary
# temp file or directory write through a symlinked `dir`, and path traversal through an unsanitised
# prefix or postfix). Both require the caller, meaning lighthouse or puppeteer's own internal code, to
# pass an attacker-controlled path or archive into these functions. Nothing in this project's usage
# does that: `lhci autorun` calls a well-known config and two hard-coded local URLs, and no user
# input, uploaded file or externally supplied path ever reaches the tool.
#
# The 2026-09-04 re-triage under T-050 put the count at thirteen rather than ten. The three new ones
# are qs, body-parser and express, all moderate, reached through @lhci/cli's own local report server
# rather than through this product, which has no Express. Same verdict: dev-only, never bundled, and
# unreachable in how this project invokes the tool. Recorded rather than left as a stale "10" that
# quietly stops matching the output.
#
# This is accepted risk rather than a false positive. The CVEs are real but unreachable here: a
# devDependency, never bundled, running only inside a disposable CI runner with `--ignore-scripts`
# already blocking install-time code execution project-wide. The residual exposure is the one PR #8
# named and accepted - a compromised @lhci/cli publishing a malicious release would run in CI with
# build access - which is a supply-chain trust question rather than something these two CVEs change.
# So production dependencies gate on high and critical, where there are zero findings because the
# frontend bundle never includes @lhci/cli, and the full tree is reported without blocking.
#
# T-050 again, on the gate's shape. This step used to be `npm audit --omit=dev --audit-level=high`,
# and it failed three times across two batches with registry errors on an unchanged lockfile, 400 and
# 503, passing on re-run each time. The advisory service is genuinely flaky, reproduced locally as a
# network timeout against the bulk endpoint, so it is not a matter of which endpoint npm picks. The
# problem was never the flakiness. It was that `npm audit` exits non-zero both for "found a
# high-severity CVE" and for "the registry did not answer", so the two were indistinguishable, and a
# gate whose failures are routinely not its subject is one people learn to re-run without reading.
# Same class as T-041. audit-gate.mjs separates them: exit 1 is an advisory and names the package,
# exit 2 is a transport failure and says it is not a finding, and it retries before giving up. The
# canary fixture is what stops the gate silently passing forever: it pins a package with a known
# critical CVE and the gate MUST fail on it, which it did not on the first attempt, because npm prints
# its error object as JSON on stdout, that parsed cleanly, and a report with no metadata counted as
# zero advisories. A dependency gate that has quietly stopped checking looks exactly like a clean
# repository from the outside.
#
# ANALYSIS SCOPE AND THE WORKING DIRECTORY. begin, build and end MUST share one working directory. The
# scanner writes .sonarqube relative to where `begin` ran and the injected MSBuild targets look for it
# there; running begin at the root and the build in src/backend produced "unable to collect the
# required information about your projects" with every step reporting success. Root is the right
# shared directory, because it makes the scanner's base directory cover src/ so the frontend stays in
# scope: disabling Automatic Analysis removed the only thing scanning TypeScript, so a backend-only
# base directory would trade one blind spot for another.
#
# sonar.sources is deliberately absent, since the .NET scanner ignores it with a warning and derives
# scope from the MSBuild graph plus the base directory. sonar.test.inclusions IS set, under Task
# #22/PR #71 and corrected in Task #26, because it classifies the frontend's TypeScript test sources:
# without it the server falls back to filename-suffix detection and misses any test support file that
# is not itself a *.spec.ts, such as tests/e2e/fixtures.ts, rating it as main code. PR #71 originally
# set sonar.tests for this, which looks right and does nothing; the scanner's own warning names the
# supported property, and it was silently ignored until a post-merge audit caught fixtures.ts still
# misclassified on main days after that PR merged green.
#
# The scope values come from .sonar/analysis-scope.properties, a version-controlled file with the
# reasoning beside each value, because the SonarScanner for .NET does not read sonar-project.properties
# and a file that looks authoritative and is never read is its own failure.
#
# TESTS AND COVERAGE. opencover, because that is the format the C# scanner consumes and
# coverlet.collector is already referenced by all three test projects.
#
# The integration suite runs in THIS job rather than its own, under MSP-70. Coverage reports cannot
# cross a job boundary without being uploaded and downloaded as artifacts, and `sonar end` only sees
# what is on disk beside it, so while the suite lived in a separate job it contributed nothing no
# matter what flags it was given. That was not a small omission. Measured locally at the time: unit
# 242 of 16,101 sequence points (1.5%), architecture 0 (0.0%), integration 13,703 (85.1%). The suite
# carrying effectively all backend coverage was the one suite not collected, which is why PR #5's four
# new integration tests reported 0.0% coverage on new code. Merging the jobs costs the parallelism the
# separate job bought, about 1m40 on this job's wall time; passing artifacts between jobs would not
# have recovered it, because `backend` would have to wait on the integration job regardless.
#
# Each `dotnet test` writes to its own GUID subdirectory, so ./TestResults holds three
# coverage.opencover.xml files that the scanner's wildcard picks up. They are listed explicitly
# because "the wildcard matched three files" and "the scanner merged three files" are different
# claims, and only the second is being relied on.
#
# Frontend coverage is generated here for the same reason the integration suite moved: the scanner
# reads what is on disk beside it, and `frontend` is a different job. vitest runs with `all: true`, so
# every source file enters the denominator rather than the frontend quietly contributing no data and
# shrinking the denominator it should be enlarging. `--ignore-scripts` because dependency lifecycle
# scripts would otherwise execute here with access to the build; Sonar raised this against this exact
# line and it is a fair finding, doubly so given the dev tree's unfixable advisories above. Verified
# that the step produces identical coverage without them.
#
#
# THE QUALITY GATE, WHICH IS THE AUTHORITATIVE ONE
#
# This workflow's own gate step, not SonarCloud's check, is what must be green to merge.
#
# SonarCloud's "Sonar way" gate is built in and cannot be edited on this plan, and it requires 80%
# coverage on new code. That is unmeetable for any change that is mostly wiring or configuration, so
# its check goes red on legitimate work as a matter of routine. The danger is not that coverage stops
# being enforced, since the floor below handles that. It is that Sonar's check also carries the
# conditions we genuinely care about - security rating, reliability rating, duplication - and a check
# that is red routinely stops being read, so a real security regression arrives inside a red X that
# looks like all the other red Xs. This repository has already produced exactly that failure:
# `retries: 1` on the accessibility suite cried wolf until nobody looked, and concealed a
# deterministic Dialog failure for as long as it sat there.
#
# So this gate enforces Sonar's OWN ratings unchanged, and evaluates coverage against the 45% floor we
# agreed rather than the 80% we are stuck with. One check that is red only when something is actually
# wrong. SonarCloud's own check is advisory: do not read a red Sonar badge as a broken build, and more
# importantly do not read a green one as a clean project.
#
# THE COVERAGE RATCHET is a floor that goes up, never down. If a pull request cannot meet it, the
# answer is tests rather than an edit to the number. A gate nobody can meet gets waived, and this
# repository has already produced one of those.
#
# Why 45%, and on new code only. Overall coverage was 32.4% at MSP-70, the first honest measurement
# this project had, dragged down by a large existing untested surface - the frontend at 0% and older
# backend code - so gating on it would punish work that is not the problem. Code written from here
# should be tested, and a new-code floor around 30% would permit new code that is mostly untested,
# which defeats the point. Not higher, because PR #4 measured 47.3% on genuinely honest work that
# included Program.cs wiring, which is awkward to cover, and a bar at 50% would have failed it. 45%
# sits just under a real, recent, good pull request.
#
# Overall coverage is deliberately not gated yet. 32.4% is recorded as the baseline, should climb
# under its own weight, and gets a gate once it is moving.
#
# Why this lives in CI rather than in the SonarCloud quality gate: the project is on the free plan,
# which cannot associate any gate other than the built-in one. Creating a custom gate is possible but
# it could never be attached to this project, which would be an instrument that looks configured and
# does nothing. The gate step reads Sonar's own new_coverage measure rather than recomputing "new
# code", so it agrees with the dashboard by construction instead of drifting from it.
#
# The gate step is deliberately NOT continue-on-error: a genuine ratings or coverage-floor breach must
# still fail the build. It is instead conditioned on the analysis having completed, because if `Sonar
# end` did not succeed there is no fresh server-side measurement to read, and a gate evaluating stale
# or absent data would either pass vacuously or fail for a reason that is not this pull request's
# fault. Both are worse than not running, and a skipped step does not fail the job.
#
#
# VERIFYING THE SCOPE THE SERVER ACTUALLY RECEIVED
#
# MSP-96: what the server received, not what a file says. We have been wrong twice about the
# difference between a configuration file and the thing that reads it - sonar-project.properties is
# not read by the .NET scanner at all, and two exclusion lists disagreed on casing for a day. This
# step asks the server what it actually holds. It is deliberately permanent rather than a one-off
# query, because a fact established once by someone running a command is the class of evidence this
# phase exists to replace. Informational queries are optional, so that a 404 from a neighbouring
# endpoint cannot stop the assertion from running.
#
# THE NEW CODE DEFINITION is asserted rather than merely printed. It was inheriting the SonarCloud
# instance default of a 7-day rolling window, which nobody chose and which DRAINS: code written eight
# days ago stops being new and leaves every new-code condition permanently. Every condition in the
# MSP-70 blocking flip is a new-code condition, so the gate would have emptied itself on a timer while
# reporting green - the only entry in the register that would have arrived while everyone did the
# right thing.
#
# It was set to a reference branch of main, and that broke the push-to-main analysis itself the same
# day: "Invalid new code period 'main': version is none of the existing ones". A long-lived branch
# cannot reference itself as its own diff target, and the project-level setting applies to main's own
# analysis rather than only to PR comparisons. Found because main's push workflow went red
# immediately after merge, which a PR run never exercises. It is now a fixed 90-day window: valid on
# every branch including main, requiring no reference, and draining far slower than the 7-day default
# it replaced. Whether PR gate conditions read this project-level setting at all, as opposed to always
# diffing against the PR's target branch through a separate mechanism, is unconfirmed and is the open
# question rather than an assumption.
#
#
# HOW THE GATE READS AND REPORTS
#
# Every network response is written to a file and then read, rather than piped into an interpreter.
# Sonar flagged the pipe form (S7772) on three lines of the first version. The pipe was arguably safe,
# since the python programs are literals and the response is only ever parsed as JSON, but arguing
# that is worse than not doing it, and going through a file is genuinely better: curl's exit status
# becomes checkable, and a failed request leaves something inspectable instead of an empty stdin.
#
# `sonar end` writes the analysis task URL, and using it avoids guessing branch or PR keys.
# Server-side analysis is asynchronous, so the measure does not exist until it finishes. When the
# analysis fails, the step prints the SERVER's own reason: without that it said only "Sonar analysis
# FAILED", which is indistinguishable between a broken analysis and a refusal that has nothing to do
# with the code. The first time it fired it was the latter - SonarCloud refused the main-branch
# analysis because the organization would cross the free plan's 50,000-line limit - which cost a round
# trip through a browser to discover.
#
# A refused analysis on a push to MAIN is a warning; on a PULL REQUEST it stays fatal. The gate's
# purpose is to block a merge, and a merge is blocked on the pull request. Nothing is weakened: a PR
# whose analysis the server refuses still fails, so no unreviewed code reaches main behind a skipped
# rating. What it stops is main going red for a reason no commit can fix, which is the failure this
# repository has already paid for once.
#
# Sonar's own per-condition verdicts are read from the quality gate rather than recomputed, so the
# ratings enforced here are exactly the ones Sonar computed, with no second opinion to drift out of
# step with the dashboard. Ratings are 1=A through 5=E. new_coverage is excluded from that loop
# because it is judged against our floor rather than Sonar's unmeetable 80%.
#
# A quality gate returning no conditions means the check did not run, and is failed rather than
# passed: the same rule as everywhere else in this workflow.
#
# The rating conditions are enforced on PULL REQUESTS ONLY, for the identical reason the coverage
# floor is, and found the same way - by main's own push analysis going red. On a pull request Sonar's
# "new code" is the diff, which is what these ratings are meant to judge. On a push to main it is
# whatever the new-code period says, and on a project this young almost any period covers nearly the
# whole history: the push right after that fix landed reported 5,327 "new" lines and failed
# Reliability at C and Duplication at 3.4% over effectively the entire codebase. That is overall
# quality wearing a new-code label. Every change still reaches main through a PR, where these are
# enforced, so nothing escapes review; only main's own after-the-fact analysis is exempt.
#
# When a rating fails, the step NAMES the issues rather than printing the grade alone. It once
# reported "Reliability rating on new code: C (ERROR)" and nothing else, so the only way to find out
# which rule fired was to open SonarCloud, which needs an account. Two commits were spent guessing at
# the diff, both fixing real defects, neither the one Sonar meant. The token is already in the step,
# so printing the issues costs one request and turns a letter grade into something actionable from the
# log alone.
#
# A condition going missing is a silent loss of enforcement, UNLESS there was no new code at all, in
# which case Sonar legitimately has nothing to rate: a docs-only PR has zero lines in any
# duplication-eligible language so that condition is not computed, while Reliability and Security
# default to a trivial pass on an empty diff and are still reported. That asymmetry is real Sonar
# behaviour and was found by this exact audit failing on itself. So the step fails loudly only when a
# condition goes missing while there was code for it to judge. The same distinction applies to
# coverage: an absent measurement is not a failing one, and this project also ignores coverage
# conditions below 20 new lines.
#
# The coverage floor is PULL REQUESTS ONLY, and that is a correctness fix rather than a softening. On
# main, the new-code period makes main's new code essentially the entire codebase: the first run of
# this check on main reported 28.9% over 4,687 new lines and failed, which is the overall coverage
# number wearing a new-code label, and gating overall coverage is the one thing explicitly not being
# done yet.
#
# WHOLE-PROJECT NUMBERS ARE REPORTED, NOT ENFORCED. The new-code conditions stop things getting worse
# and are achievable today; these cannot pass until the existing debt is fixed, and a gate that cannot
# pass gets ignored. They are printed so the repair work can be watched moving rather than found out
# about at the end.
#
# Task #12: this section always reads main's own last analysis, pinned to branch=main explicitly, on a
# PR run included. The call used to omit scope entirely and fall back silently to the default branch,
# so on a PR it read main from BEFORE the PR being gated, while every other figure in the step used
# the right scope. PR #28 reported 13,251 lines and 49.6% coverage while its own post-merge state was
# 14,693 and 51.4%. The obvious fix, passing the PR scope here too, is NOT correct and was caught only
# by testing it: PR analysis computes new-code metrics only, and querying with `pullRequest=N` on a
# real PR returned ncloc=376 for a codebase of about 15,300 lines - not the PR's merged state, a
# near-arbitrary small number, worse than staleness because it looks precise while being meaningless.
# There is no PR-scoped whole-project reading to fall back to, for any PR, ever. So it reads main, the
# only branch type these metrics are real for, makes that explicit rather than accidental, and labels
# the output so nobody mistakes it for the PR's own state.
#
# Task #13, decided 2026-08-30 and closing Phase 4: these stay reporting-only and are NOT flipped to
# blocking. A whole-project metric that only ever reflects main's past state, never the PR being
# reviewed, is not something a PR can pass or fail on its own content; blocking on it would judge
# every open PR identically off a number that PR cannot move. Building a second gate when the project
# already has a real, PR-specific one would be exactly the instrument-over-nothing pattern this audit
# exists to remove. The numbers remain printed because watching whole-project debt move is useful,
# just never as a block. If this needs revisiting, that is a new decision to take deliberately rather
# than a default this note should silently expire into.
#
# Where the report has nothing to say, it says so, rather than printing nothing and letting an empty
# section read as "no problems".
#
#
# THE frontend JOB
#
# MSP-94: restored. This job and `docker-build` were deleted by PR #7 when CI was consolidated into a
# single job for the scanner's benefit, and that commit's message is long and careful about the
# coverage ratchet while not mentioning the removal. For a day afterwards CI ran no typecheck, no
# lint, no `npm run build`, no accessibility suite and no container build. Nothing was red: the checks
# were ABSENT, and absence renders as a green PR summary. Both "green tests, red build" entries on
# MSP-83 were caught by `npm run build`, so for that day the only thing standing behind them was
# somebody remembering to run it locally. The job names matter as much as the steps, because branch
# protection binds to names.
#
# Install uses `--ignore-scripts` (githubactions:S6505): dependency lifecycle scripts execute
# arbitrary code during install. Verified the build still succeeds without them, since esbuild's
# postinstall is not load-bearing here and the platform binary arrives through optionalDependencies.
#
# npx IS FORBIDDEN IN THIS WORKFLOW, and the step that greps for it is why. Stage 1 removed every such
# call in favour of lockfile-pinned npm scripts, because the tool fetches and executes whatever
# version is published at that moment, which is a supply-chain exposure in CI rather than a style
# preference (githubactions:S6505 and S8543). A comment saying so already sat in this file. It did not
# work: on that very ticket the forbidden call was written nineteen lines below the comment, and what
# caught it was the Sonar gate turning Security-on-new-code to C. An instrument caught it, not the
# comment, and the removal was reversible by anyone in under a minute. So there is now a grep, which
# cannot be read past. Its pattern is assembled from a variable so the step does not match itself, and
# comment lines are stripped so this explanation does not trip it either. Both of those are the
# difference between a guard that works and one that fails on its own text.
#
# LINT, WITH ITS DENOMINATOR ASSERTED (MSP-95). oxlint prints no summary and no file count by default:
# it reports diagnostics and nothing else, so a run that linted zero files is indistinguishable from a
# clean one. That is the fifth instrument in this repository found reporting over an unstated set, and
# `tsc --noEmit` spent the life of the project in exactly that position. The JSON reporter carries
# number_of_files and number_of_rules, and both are asserted, so choosing rules deliberately cannot be
# undone later by the step silently linting nothing. Warnings themselves are advisory, per
# .oxlintrc.json.
#
# BUILD is kept separate from the vitest run in the backend job on purpose. Vitest passing while the
# build fails is a real, recorded pathology here - TS18048 and `extends RenderResult` both did exactly
# that - so the type-checking build is its own gate rather than a by-product.
#
# LIGHTHOUSE (Task #20/MSP-47) is real again rather than restored-but-unwired: this is the first
# workflow step that has ever actually invoked @lhci/cli, which sat in package.json unused before it
# was removed entirely. It is advisory, and continue-on-error is deliberate. There is no established
# baseline yet to call a regression against; shared runners have real CPU and network variance, so a
# strict threshold risks becoming the pattern this codebase has already rejected once, where a noisy
# required check trains people to stop reading it; and the same precedent as Task #13 applies, that a
# measurement-only signal is reported rather than enforced until it has proven stable on merit.
# lighthouserc.json's own assertions still run and still fail the step's exit code, which is what
# makes the printed numbers meaningful rather than decorative; continue-on-error only stops that from
# failing the job. The numbers are printed separately because `lhci autorun` never prints them to the
# log, only pass or fail per assertion and only on failure, and a measurement nobody can read back out
# of the log is barely better than the unmeasured state this task exists to close. `if: always()` so a
# violation still gets its numbers printed rather than silence.
#
# PLAYWRIGHT AND AXE is the repository's only accessibility gate. MSP-79 removed a masking retry from
# this suite, which exposed UI/Dialog failing 6 of 6 deterministically, and proved 10 consecutive
# green runs - and then the suite stopped running two hours later when this job was deleted.
#
#
# THE docker-build JOB
#
# No `needs:`. It checks out the source and runs `docker build` against the Dockerfile, consuming
# nothing the `backend` job produces, so waiting eight minutes to spend forty seconds bought only the
# ordering of two independent failures. A broken Dockerfile now reports at the same time as a broken
# test rather than after it. The container is the deployment artifact: without this step, a broken
# Dockerfile ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-checks:
    name: Fast checks (build, unit, architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/backend/MotsSupplierPortal.slnx

      - name: Build
        run: dotnet build src/backend/MotsSupplierPortal.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test src/backend/Tests/Unit/MotsSupplierPortal.Tests.Unit.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Architecture tests (NetArchTest)
        run: dotnet test src/backend/Tests/Architecture/MotsSupplierPortal.Tests.Architecture.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check for Sonar token
        id: sonar
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Setup Java (required by the Sonar scanner)
        continue-on-error: true
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Sonar scanner
        continue-on-error: true
        if: steps.sonar.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner --version 10.4.0

      - name: Restore
        run: dotnet restore src/backend/MotsSupplierPortal.slnx

      - name: Dependency scan (.NET)
        run: |
          set -o pipefail
          dotnet list src/backend/MotsSupplierPortal.slnx package --vulnerable --include-transitive 2>&1 | tee /tmp/dotnet-vuln.txt

          if ! grep -qE 'has the following vulnerable|has no vulnerable packages' /tmp/dotnet-vuln.txt; then
            echo "::error::Vulnerability scan produced no per-project verdict - it did not run. Treating as failure."
            exit 1
          fi

          if grep -qE '\s(High|Critical)\s+https' /tmp/dotnet-vuln.txt; then
            echo "::error::High or Critical severity vulnerability in a NuGet dependency"
            grep -E '\s(High|Critical)\s+https' /tmp/dotnet-vuln.txt
            exit 1
          fi
          echo "No High/Critical NuGet advisories."

      - name: Dependency scan (npm) - the gate still bites
        run: |
          set +e
          node .github/audit/audit-gate.mjs .github/audit/known-vulnerable
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::The audit gate did not fail on a package with a known critical CVE (exit $code)."
            echo "::error::Either the gate has stopped checking, or the registry is unreachable - both must block."
            exit 1
          fi
          echo "Canary failed as required: the gate is live."

      - name: Dependency scan (npm)
        run: |
          echo "--- full tree (reported, not blocking - see the triage comment above) ---"
          npm audit --package-lock-only --prefix src/frontend || true

          echo "--- production dependencies (blocking on high/critical) ---"
          node .github/audit/audit-gate.mjs src/frontend

      - name: Load analysis scope
        continue-on-error: true
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          set -a && . ./.sonar/analysis-scope.properties && set +a
          {
            echo "SONAR_EXCLUSIONS=$SONAR_EXCLUSIONS"
            echo "SONAR_COVERAGE_EXCLUSIONS=$SONAR_COVERAGE_EXCLUSIONS"
            echo "SONAR_CPD_EXCLUSIONS=$SONAR_CPD_EXCLUSIONS"
            echo "SONAR_TEST_PATHS=$SONAR_TEST_PATHS"
          } >> "$GITHUB_ENV"
          echo "Analysis scope loaded:"
          echo "  exclusions:          $SONAR_EXCLUSIONS"
          echo "  coverage exclusions: $SONAR_COVERAGE_EXCLUSIONS"
          echo "  cpd exclusions:      $SONAR_CPD_EXCLUSIONS"
          echo "  test paths:          $SONAR_TEST_PATHS"

      - name: Sonar begin
        continue-on-error: true
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"ZaidEng7_mots-supplier-portal" \
            /o:"zaideng7" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="src/frontend/coverage/lcov.info" \
            /d:sonar.typescript.lcov.reportPaths="src/frontend/coverage/lcov.info" \
            /d:sonar.coverage.exclusions="$SONAR_COVERAGE_EXCLUSIONS" \
            /d:sonar.cpd.exclusions="$SONAR_CPD_EXCLUSIONS" \
            /d:sonar.exclusions="$SONAR_EXCLUSIONS" \
            /d:sonar.test.inclusions="$SONAR_TEST_PATHS" \

      - name: Build
        run: dotnet build src/backend/MotsSupplierPortal.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test src/backend/Tests/Unit/MotsSupplierPortal.Tests.Unit.csproj --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./TestResults

      - name: Architecture tests (NetArchTest)
        run: dotnet test src/backend/Tests/Architecture/MotsSupplierPortal.Tests.Architecture.csproj --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./TestResults

      # Testcontainers starts a real Postgres, MinIO and ClamAV, and has to fetch those images from Docker Hub
      # before it can start anything. Docker Hub meters anonymous downloads by network address, and GitHub's
      # hosted runners are shared by an enormous number of projects behind a small pool of addresses, so the
      # quota is spent by strangers rather than by us. On 2026-09-24 it ran out: every image download was
      # refused with "unauthorized: access to the requested resource is not authorized", every container-backed
      # test failed together in about thirty seconds, and the same suite passed locally and on main.
      #
      # Signing in moves the quota from that shared address to this account, where nobody else is spending it.
      # The token is read-only against public images, which is the whole of what a download needs.
      #
      # It is skipped when the secret is absent so a fork still builds - the same rule the Sonar steps follow -
      # and that path is exactly the anonymous behaviour this repository had until now.
      #
      # WHAT THIS IS NOT: a fix for anything in this product. It is a change of who asks Docker Hub for a copy
      # of Postgres. If the authenticated quota is ever exhausted too, the durable answer is mirroring the three
      # images into a registry this project controls, not a larger token.
      - name: Check for Docker Hub credentials
        id: dockerhub
        run: echo "enabled=${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Sign in to Docker Hub so Testcontainers can pull its images
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Integration tests (real Postgres via Testcontainers)
        run: dotnet test src/backend/Tests/Integration/MotsSupplierPortal.Tests.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./TestResults

      - name: Frontend coverage
        working-directory: src/frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: Show collected coverage reports
        run: |
          echo "Backend coverage reports handed to the scanner:"
          find ./TestResults -name coverage.opencover.xml -print
          echo "Frontend lcov:"
          wc -l src/frontend/coverage/lcov.info

      - name: Sonar end
        id: sonar_end
        continue-on-error: true
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Verify analysis scope as the server received it
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: ZaidEng7_mots-supplier-portal
        run: |
          set -euo pipefail
          api() { curl -sSf -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/$1"; }
          api_opt() { curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/$1" 2>/dev/null || echo '{}'; }

          echo "== whole-project measures =="
          api "measures/component?component=$PROJECT_KEY&metricKeys=ncloc,coverage,lines_to_cover,duplicated_lines_density,tests" \
            | jq -r '.component.measures[] | "  \(.metric): \(.value)"' | sort

          echo ""
          echo "== resetting new code period to days/90 (hotfix) =="
          curl -sS -u "$SONAR_TOKEN:" -X POST \
            "https://sonarcloud.io/api/settings/set?component=$PROJECT_KEY&key=sonar.leak.period.type&value=days" \
            -o hotfix1.json -w "  set type -> HTTP %{http_code}\n" || true
          curl -sS -u "$SONAR_TOKEN:" -X POST \
            "https://sonarcloud.io/api/settings/set?component=$PROJECT_KEY&key=sonar.leak.period&value=90" \
            -o hotfix2.json -w "  set value -> HTTP %{http_code}\n" || true

          echo "== new code definition =="
          api_opt "settings/values?component=$PROJECT_KEY&keys=sonar.leak.period.type,sonar.leak.period,sonar.new_code_period.type" | jq -c . | sed 's/^/    /'

          echo ""
          echo "== exclusions as the server holds them =="
          api_opt "settings/values?component=$PROJECT_KEY&keys=sonar.exclusions,sonar.coverage.exclusions,sonar.cpd.exclusions" \
            | jq -r 'if (.settings | length) == 0 then "  (none stored server-side - set per analysis via /d: arguments)" else (.settings[] | "  \(.key) = \(.value // (.values | join(",")))") end'

          echo ""
          echo "== DENOMINATOR ASSERTION: is test code rated as main code? =="
          api "measures/component_tree?component=$PROJECT_KEY&metricKeys=ncloc&qualifiers=FIL&ps=500&s=metric&metricSort=ncloc&asc=false" > tree.json

          total_files=$(jq '[.components[]] | length' tree.json)
          test_files=$(jq -r '[.components[] | select(.path // "" | test("^src/backend/Tests/|^src/frontend/tests/"))] | length' tree.json)

          echo "  files carrying an ncloc measure: $total_files"
          echo "  of those, under a test path:     $test_files"

          if [ "$total_files" -lt 50 ]; then
            echo "::error::Only $total_files files carry an ncloc measure. That is too few for this"
            echo "::error::codebase - the analysis scope has collapsed, and every rating derived"
            echo "::error::from it is being computed over almost nothing."
            exit 1
          fi

          if [ "$test_files" -ne 0 ]; then
            echo "::error::$test_files test files are rated as main code. Project ratings are"
            echo "::error::averaged over code that cannot contain the defects they claim to measure."
            jq -r '.components[] | select(.path // "" | test("^src/backend/Tests/|^src/frontend/tests/")) | "  " + .path' tree.json | head -20
            exit 1
          fi

          echo "  OK - test sources are classified as tests, not as main code."

      - name: Quality gate (Sonar ratings + 45% coverage floor)
        if: steps.sonar.outputs.enabled == 'true' && steps.sonar_end.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          THRESHOLD: "45"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_KEY: ZaidEng7_mots-supplier-portal
        run: |
          set -euo pipefail

          api() {
            local url="$1" out="$2"
            if ! curl -sSf -u "$SONAR_TOKEN:" "$url" -o "$out"; then
              echo "::error::Request to SonarCloud failed: $url"
              exit 1
            fi
          }

          TASK_URL=$(grep '^ceTaskUrl=' .sonarqube/out/.sonar/report-task.txt | cut -d= -f2-)
          [ -n "$TASK_URL" ] || { echo "::error::No ceTaskUrl - cannot verify coverage"; exit 1; }

          STATUS=""
          for _ in $(seq 1 40); do
            api "$TASK_URL" task.json
            STATUS=$(python3 -c "import json;print(json.load(open('task.json'))['task']['status'])")
            case "$STATUS" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                python3 -c "import json;t=json.load(open('task.json'))['task'];print('::error::Sonar analysis',t['status'],'-',t.get('errorMessage','no reason given by the server'))"
                if [ -z "${PR_NUMBER:-}" ]; then
                  echo "::warning::Sonar could not analyze main; the ratings below were NOT checked for this push. The gate still enforces on pull requests."
                  exit 0
                fi
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          [ "$STATUS" = "SUCCESS" ] || { echo "::error::Sonar analysis did not finish in time"; exit 1; }

          if [ -n "${PR_NUMBER:-}" ]; then
            SCOPE="pullRequest=$PR_NUMBER"
          else
            SCOPE="branch=main"
          fi

          BASE="https://sonarcloud.io/api/measures/component?component=ZaidEng7_mots-supplier-portal"
          api "$BASE&metricKeys=new_coverage&$SCOPE" coverage.json
          api "$BASE&metricKeys=new_lines_to_cover&$SCOPE" newlines.json

          api "https://sonarcloud.io/api/qualitygates/project_status?projectKey=ZaidEng7_mots-supplier-portal&$SCOPE" gate.json

          api "$BASE&metricKeys=security_rating,reliability_rating,sqale_rating,coverage,duplicated_lines_density,ncloc&branch=main" overall.json

          python3 - <<'PYEOF'
          import json, os, sys

          def measure(path):
              data = json.load(open(path))
              for m in data.get("component", {}).get("measures", []):
                  periods = [m["period"]] if "period" in m else m.get("periods", [])
                  for p in periods:
                      return p.get("value")
                  if "value" in m:
                      return m["value"]
              return None

          import subprocess

          failures = []

          def issues_for(quality):
              """Open issues on THIS pull request affecting one software quality.

              Kept next to the gate rather than in a separate step so a failing rating and the reason
              for it appear together in the log.
              """
              try:
                  import urllib.parse
                  query = urllib.parse.urlencode({
                      "componentKeys": os.environ["PROJECT_KEY"],
                      "pullRequest": os.environ.get("PR_NUMBER", ""),
                      "resolved": "false",
                      "impactSoftwareQualities": quality,
                      "ps": "25",
                  })
                  raw = subprocess.run(
                      ["curl", "-sS", "-u", f"{os.environ['SONAR_TOKEN']}:",
                       f"https://sonarcloud.io/api/issues/search?{query}"],
                      capture_output=True, text=True, check=True).stdout
                  return json.loads(raw).get("issues", [])
              except Exception as exc:  # noqa: BLE001 - a diagnostic must never fail the gate itself
                  print(f"  (could not list issues: {exc})")
                  return []

          on_pull_request = bool(os.environ.get("PR_NUMBER"))

          RATINGS = {"1": "A", "2": "B", "3": "C", "4": "D", "5": "E"}
          ENFORCED = {
              "new_security_rating":          "Security rating on new code",
              "new_reliability_rating":       "Reliability rating on new code",
              "new_duplicated_lines_density": "Duplicated lines on new code",
          }

          gate = json.load(open("gate.json")).get("projectStatus", {})
          conditions = gate.get("conditions", [])
          if not conditions:
              print("::error::Quality gate returned no conditions - the check did not run")
              sys.exit(1)

          new_lines = measure("newlines.json") or "0"
          has_new_code = float(new_lines) > 0

          seen = set()
          for c in conditions:
              key = c.get("metricKey")
              seen.add(key)
              if key not in ENFORCED:
                  continue
              actual, status = c.get("actualValue"), c.get("status")
              shown = RATINGS.get(actual, actual) if key.endswith("_rating") else actual
              print(f"{ENFORCED[key]}: {shown} ({status})")
              if status == "ERROR":
                  if on_pull_request:
                      failures.append(f"{ENFORCED[key]} = {shown}")
                      if key.endswith("_rating"):
                          quality = "RELIABILITY" if "reliability" in key else "SECURITY"
                          issues = issues_for(quality)
                          if issues:
                              print(f"  {ENFORCED[key]} - offending issues:")
                              for i in issues:
                                  loc = i.get("component", "?").split(":")[-1]
                                  print(f"    {i.get('severity','?')} {i.get('rule','?')} "
                                        f"{loc}:{i.get('line','?')} - {i.get('message','?')}")
                          else:
                              print(f"  ({ENFORCED[key]} failed but the issues API returned none - "
                                    f"check the dashboard)")
                  else:
                      print(f"  (not enforced on main - see MSP-70; this metric on this branch "
                            f"is currently rating the whole project, not a diff)")

          missing = [k for k in ENFORCED if k not in seen]
          if missing and has_new_code:
              print(f"::error::Quality gate no longer reports {', '.join(missing)} - enforcement would be silently reduced")
              sys.exit(1)
          elif missing:
              print(f"  ({', '.join(missing)} not reported - no new code in any CPD-eligible language, nothing to rate)")

          threshold = float(os.environ["THRESHOLD"])
          coverage = measure("coverage.json")

          if not on_pull_request:
              print(f"Coverage: {coverage}% over {new_lines} new lines - floor not applied on main "
                    f"(see comment above).")

          if not on_pull_request:
              pass
          elif coverage is None:
              if float(new_lines) == 0:
                  print("Coverage: no new lines to cover - ratchet not applicable.")
              else:
                  print(f"::error::new_coverage missing despite {new_lines} new lines to cover - the check did not run")
                  sys.exit(1)
          else:
              coverage = float(coverage)
              print(f"Coverage on new code: {coverage}% (floor {threshold}%, on {new_lines} new lines to cover)")
              if coverage < threshold:
                  failures.append(f"new-code coverage {coverage}% < {threshold}% floor - add tests, do not lower the floor")

          print("")
          print("Whole project on main (reported, not enforced by decision - Task #13/Phase 4 closed "
                "2026-08-30; this always reads main's own last analysis, never a PR's - see comment "
                "above):")
          LABELS = [
              ("security_rating",          "Security rating",   True),
              ("reliability_rating",       "Reliability rating", True),
              ("sqale_rating",             "Maintainability",   True),
              ("coverage",                 "Coverage",          False),
              ("duplicated_lines_density", "Duplication",       False),
              ("ncloc",                    "Lines of code",     False),
          ]
          try:
              overall = {
                  m["metric"]: m.get("value")
                  for m in json.load(open("overall.json")).get("component", {}).get("measures", [])
              }
          except (OSError, ValueError):
              overall = {}

          if not overall:
              print("  (whole-project measures unavailable this run)")
          else:
              for key, label, is_rating in LABELS:
                  v = overall.get(key)
                  if v is None:
                      print(f"  {label}: unavailable")
                  elif is_rating:
                      print(f"  {label}: {RATINGS.get(str(int(float(v))), v)}")
                  else:
                      print(f"  {label}: {v}")

          if failures:
              print("")
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print("")
          print("Quality gate passed (Sonar ratings + 45% coverage floor).")
          PYEOF

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Forbid unpinned tool invocation in CI
        run: |
          set -euo pipefail
          TOOL="npx"
          if grep -vE '^[[:space:]]*#' .github/workflows/*.yml \
             | grep -nE "(^|[^a-zA-Z_-])$TOOL "; then
            echo "::error::$TOOL found in a workflow file. Tools must be invoked through npm"
            echo "::error::scripts so they resolve from lockfile-pinned node_modules."
            echo "::error::Add a script to package.json and call it with npm run --silent."
            exit 1
          fi
          echo "Clean: no $TOOL in any workflow file."

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: |
          set -euo pipefail
          npm run --silent lint:json > lint.json || true

          files=$(jq -r '.number_of_files' lint.json)
          rules=$(jq -r '.number_of_rules' lint.json)
          errors=$(jq -r '[.diagnostics[]? | select(.severity == "error")] | length' lint.json)
          warnings=$(jq -r '[.diagnostics[]? | select(.severity == "warning")] | length' lint.json)

          echo "Lint: $files files, $rules rules, $errors errors, $warnings warnings"

          if [ "$files" -lt 50 ]; then
            echo "::error::oxlint examined only $files files. This project has ~72 lintable"
            echo "::error::sources; a collapsed file set makes a clean lint meaningless."
            exit 1
          fi

          if [ "$rules" -lt 50 ]; then
            echo "::error::Only $rules rules were active. A near-empty ruleset passes everything."
            exit 1
          fi

          npm run lint

      - name: Build
        run: npm run build

      - name: Lighthouse CI (LCP/CLS, advisory)
        run: npm run lhci
        continue-on-error: true

      - name: Print Lighthouse LCP/CLS results
        if: always()
        working-directory: src/frontend
        run: |
          if ! ls .lighthouseci/lhr-*.json >/dev/null 2>&1; then
            echo "::warning::No Lighthouse reports found - the run above did not complete."
            exit 0
          fi
          for f in .lighthouseci/lhr-*.json; do
            jq -r '"\(.finalUrl): LCP=\(.audits["largest-contentful-paint"].numericValue | round)ms CLS=\(.audits["cumulative-layout-shift"].numericValue)"' "$f"
          done

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Playwright smoke + axe a11y checks
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/backend/Api/Dockerfile -t mots-supplier-portal-api:ci src/backend
