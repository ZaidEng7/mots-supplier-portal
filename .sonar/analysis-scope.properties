# Sonar analysis scope, in version control with the reasoning beside each line.
#
# WHY THIS FILE EXISTS AND NOT sonar-project.properties: the SonarScanner for .NET does not
# read sonar-project.properties - it takes settings from /d: arguments and the MSBuild
# projects. Putting these values in that file would produce a version-controlled document
# that looks authoritative and is never read, which is the exact failure mode MSP-78 was
# about. So the values live here with their reasoning, and ci.yml sources them.
#
# THE PRINCIPLE (MSP-96): an exclusion is a claim that something does not need measuring.
# Every one must be defensible out loud. None of these ever were.
#
# LITERAL PATHS, NOT PATTERNS. The previous lists used **/tests/** in one place and
# **/Tests/** in another. On a case-sensitive filesystem each excluded one side and silently
# missed the other - coverage missed src/backend/Tests, duplication missed
# src/frontend/tests. Nobody chose that; it was a typo whose blast radius only appears on
# Linux. A glob that quietly matches whatever it finds is how it happened. A literal path
# fails visibly when the directory moves, which is the behaviour we want.

# Test sources. Named once and reused by both lists below, so the two agree by construction
# rather than by someone remembering to edit both.
TEST_PATHS=src/backend/Tests/**,src/frontend/tests/**

# --- ANALYSIS SCOPE -----------------------------------------------------------------------
#
# Migrations are NOT excluded from analysis. That is a change (MSP-96) and it is deliberate.
# Excluding them from coverage and duplication is one decision; excluding them from analysis
# entirely was a different decision that nobody took. These migrations contain hand-written
# Up/Down logic and raw SQL - including the reference-code allocation deliberately rewritten
# from COUNT(*) to an atomic sequence (MSP-81). Raw SQL in a migration is exactly where an
# injection or a data-destroying Down would live, and it was the one place in this repository
# with no review from any instrument at all.
SONAR_EXCLUSIONS=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/storybook-static/**

# --- COVERAGE -----------------------------------------------------------------------------
#
# Program.cs is NOT excluded from coverage. That is also a change (MSP-96).
#
# The usual argument for excluding a composition root is that it is untestable glue. That
# argument does not hold here: the integration suite runs against WebApplicationFactory<Program>,
# so this file executes on every integration test. We were excluding a file we already cover.
#
# It holds JWT validation parameters, the deny-by-default FallbackPolicy (MSP-67), CORS, rate
# limiting and the Hangfire dashboard mapping (MSP-87) - the most security-relevant file in
# the backend, and the 45% ratchet had never seen it. If removing the exclusion moves coverage
# DOWN, that is information worth having: it would mean the Tier 1 deny-by-default work is not
# exercised by anything.
#
# Migrations stay excluded from coverage: they run once, at deploy, and are not reachable from
# a test. Story files are Storybook fixtures. Test sources are excluded because measuring the
# coverage of test code answers no question anyone has.
SONAR_COVERAGE_EXCLUSIONS=**/Migrations/**,**/*.stories.tsx,${TEST_PATHS}

# --- DUPLICATION --------------------------------------------------------------------------
#
# Migrations stay excluded: EF generates them, and duplication between generated migrations is
# inherent to how EF writes them rather than a defect. Test sources and Storybook stories are
# repetitive by nature - an arrange block that looks like the previous arrange block is usually
# clarity, not copy-paste.
SONAR_CPD_EXCLUSIONS=**/Migrations/**,**/*.spec.ts,**/*.stories.tsx,${TEST_PATHS}

# --- TEST CLASSIFICATION -------------------------------------------------------------------
#
# Task #22/PR #71: the CI "Verify analysis scope" gate failed because
# src/frontend/tests/e2e/fixtures.ts was rated as main code, not test code - the server's
# default TypeScript test-file detection matches by filename suffix (**/*.spec.ts,
# **/*.test.ts), not by directory, so a shared e2e helper that is not itself a *.spec.ts file
# fell outside it even though every sibling in the same directory (app-a11y.spec.ts,
# app-keyboard.spec.ts, etc.) was correctly classified. Reusing TEST_PATHS - already the
# literal-path definition of "this is test code" for coverage/cpd - closes the same gap for
# classification, so a future non-.spec.ts file under either test tree does not repeat this.
SONAR_TEST_PATHS=${TEST_PATHS}
