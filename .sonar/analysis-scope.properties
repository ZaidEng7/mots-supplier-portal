# Sonar analysis scope. Every value here is a claim about what does not need measuring, and every
# claim is argued in this block rather than left to be inferred from the value itself.
#
# WHY THIS FILE AND NOT sonar-project.properties. The SonarScanner for .NET does not read
# sonar-project.properties: it takes settings from /d: arguments and the MSBuild projects. Putting
# these values there would produce a version-controlled document that looks authoritative and is
# never read, which is the exact failure MSP-78 was about. So the values live here with their
# reasoning, and ci.yml sources them.
#
# THE PRINCIPLE (MSP-96). An exclusion is a claim that something does not need measuring. Every one
# must be defensible out loud. None of these ever were.
#
# LITERAL PATHS, NOT PATTERNS. The previous lists used **/tests/** in one place and **/Tests/** in
# another. On a case-sensitive filesystem each excluded one side and silently missed the other:
# coverage missed src/backend/Tests, duplication missed src/frontend/tests. Nobody chose that. It was
# a typo whose blast radius only appears on Linux, and a glob that quietly matches whatever it finds
# is how it happened. A literal path fails visibly when a directory moves, which is the behaviour
# this wants.
#
# TEST_PATHS names the test sources once and is reused by the lists below, so the two agree by
# construction rather than by somebody remembering to edit both.
#
#
# ANALYSIS SCOPE
#
# Migrations are NOT excluded from analysis. That is a change under MSP-96 and it is deliberate.
# Excluding them from coverage and duplication is one decision; excluding them from analysis entirely
# was a different decision nobody took. These migrations contain hand-written Up and Down logic and
# raw SQL, including the reference-code allocation deliberately rewritten from COUNT(*) to an atomic
# sequence under MSP-81. Raw SQL in a migration is exactly where an injection or a data-destroying
# Down would live, and it was the one place in this repository with no review from any instrument.
#
# src/frontend/comps/** is excluded from analysis, added in phase 6. They are design artboards:
# static HTML files that exist to decide a composition before any component is touched, rendered once
# each for a screenshot and then argued over. They are not an interface. Nothing in them is operated,
# submitted or read by a screen reader, and each was superseded the moment the composition it argued
# for was built.
#
# Sonar rated them as product code and returned Reliability C on new code for PR #134, on roughly 20
# instances of Web:S6853 and InputWithoutLabelCheck ("a form label must be associated with a
# control") against mock fields in a mock form. Wiring id and for through 200 lines of throwaway
# markup would buy a letter grade and make a sketch look like shipped code, which is the opposite of
# what a comp is for.
#
# They were moved out of public/ in the same commit, which is the part that actually mattered: in
# public/ they were copied into dist/ and served from the application's own origin as unauthenticated
# pages showing fabricated Ministry tender data. Under src/frontend/comps/ Vite still serves them in
# development at /comps/<name>.html, and `vite build` emits nothing for them, verified by building
# and finding no comp HTML in dist.
#
# The exclusion is therefore narrow and honest: there is no interface here to hold to an interface's
# standard. If a comp is ever promoted into the product, it stops being a comp and leaves that
# directory.
#
#
# COVERAGE
#
# Program.cs is NOT excluded from coverage, also a change under MSP-96. The usual argument for
# excluding a composition root is that it is untestable glue, and that does not hold here: the
# integration suite runs against WebApplicationFactory<Program>, so the file executes on every
# integration test. We were excluding a file we already cover. It holds the JWT validation
# parameters, the deny-by-default FallbackPolicy from MSP-67, CORS, rate limiting and the Hangfire
# dashboard mapping from MSP-87, making it the most security-relevant file in the backend, and the
# 45% ratchet had never seen it. If removing the exclusion moves coverage down, that is information
# worth having: it would mean the deny-by-default work is not exercised by anything.
#
# Migrations stay excluded from coverage because they run once, at deploy, and no test can reach
# them. Story files are Storybook fixtures. Test sources are excluded because measuring the coverage
# of test code answers no question anyone has.
#
# .github/** is excluded from coverage only, under T-050. The audit gate is CI tooling: not shipped,
# not bundled, not reachable from any test in either suite, so a unit test would have to construct a
# fake npm to say anything about it. It is not unverified. It is verified by an executable canary
# pinned to a package with a known critical CVE, which runs before the real scan on every push and
# fails the build if the gate stops rejecting it. That canary caught a real defect in the gate on its
# first run, a parsed npm error object counting as a clean report, which is more than a coverage
# percentage would have found. Stronger evidence than a line count, running more often.
#
# DevDataSeeder.cs is excluded from coverage only, added in batch 11. It is a development fixture: it
# creates eight demo accounts, five suppliers, RFQs at every stage and an award in flight so no screen
# renders an empty state on a developer's laptop, and it refuses to run anywhere but Development, in
# the seeder itself rather than only at the call site, which DevDataSeederGuardTests pins both ways.
# Nothing can execute it under test, and here that claim is stronger than "no test happens to": the
# integration fixture runs the host as Development, so this seeder DID run inside the test host, and
# its five suppliers turned up in the middle of ReviewQueuePaginationTests' assertions, which name the
# rows they expect on page one. It is gated behind DevSeed:Enabled for that reason. Covering it would
# mean re-enabling the thing that corrupts the suite, and every test that broke last time would have
# kept passing in isolation.
#
# src/frontend/vitest.setup.ts is excluded from coverage only, added in batch 13. It is the test
# harness itself: jsdom stubs for Radix, and the guard that fails any test whose code fetches a URL
# containing an `undefined` path segment. Every test runs through it and none of them can cover it,
# because the branch it exists for is the one that must never be taken, so a green suite is precisely
# a suite in which that line never executes. Measuring it asks how often the alarm went off, and
# scores a silent alarm at zero.
#
# perf/baseline.py is excluded from coverage only, under T-107. It is the latency harness: it signs in
# as six personas against a RUNNING development server, times eighteen reads and two repeatable
# writes, and prints a table. Nothing can execute it under test, because it needs a live API on
# localhost, the dev seed's accounts, a TOTP secret read out of the database, and a warm server. That
# is the same claim .github/** already carries, and for the same reason: it is the thing doing the
# measuring. Left in scope it dominates, contributing 42 of the uncovered new lines on its pull
# request against eight in all of the backend product code the same branch touched, which is how a
# 96%-covered change reads as 77%.
#
# Every one of these stays in SONAR_EXCLUSIONS, so bug and security rules still read them. Only the
# coverage floor is waived. That matters more than it sounds: S2068 reads DevDataSeeder's published
# seed password, S8733 caught two Cartesian products in it, and the rules should read perf/baseline.py
# too, because it holds seed credentials and builds URLs from a constant origin.
#
#
# DUPLICATION
#
# Migrations stay excluded because EF generates them, and duplication between generated migrations is
# inherent to how EF writes them rather than a defect. Test sources and Storybook stories are
# repetitive by nature: an arrange block that looks like the previous arrange block is usually clarity
# rather than copy-paste.
#
# On 2026-09-13, **/*.test.ts and **/*.test.tsx joined **/*.spec.ts, because leaving them out was an
# accident of where Vitest puts a file rather than a decision anyone took. The paragraph above already
# states this repository's position and TEST_PATHS was meant to carry it, but TEST_PATHS names two
# DIRECTORIES, src/backend/Tests and src/frontend/tests, and the frontend's 119 unit-test files live
# in neither: Vitest convention puts them beside the code they test, at src/frontend/src/**/*.test.tsx.
# So the same claim covered the Playwright specs, through the filename rule, and missed the unit
# tests, purely on location.
#
# Found when a pull request whose product change was four small edits failed the gate at 8.1%
# duplication on new code while the whole repository sat at 0.5%. The duplicated blocks were a new
# test's arrange section against its neighbour's in the same file, three mocked routes, a render and
# an upload, which is the exact shape the paragraph above calls clarity. They are named by FILENAME
# rather than by directory for the same reason **/*.spec.ts is: a test is a test wherever its runner
# expects it to sit, and a rule that depends on the directory breaks the next time a convention moves
# one.
#
# i18n/config.ts is excluded under Task #7/Stage C. Its ar and en blocks necessarily mirror each
# other's nested key structure (nav.home, nav.dashboard and so on in both languages) and only the
# string VALUES differ. Confirmed from the SonarCloud duplications view for PR #76 rather than
# guessed: 100% density, with the ar block at line 9 flagged as duplicated by the en block at line
# 361. That structural mirror is the entire point of a locale file, and restructuring translations to
# dodge a duplication metric would be a worse i18n architecture in service of the metric.
#
#
# TEST CLASSIFICATION
#
# Task #22/PR #71: the CI "Verify analysis scope" gate failed because
# src/frontend/tests/e2e/fixtures.ts was rated as main code rather than test code. The server's
# default TypeScript test-file detection matches by filename suffix, **/*.spec.ts and **/*.test.ts,
# not by directory, so a shared e2e helper that is not itself a *.spec.ts file fell outside it even
# though every sibling in the same directory was correctly classified. Reusing TEST_PATHS, already the
# literal-path definition of "this is test code" for coverage and duplication, closes the same gap for
# classification, so a future non-spec file under either test tree does not repeat it.
#
# Task #26: PR #71 first wired this value to sonar.tests, which the .NET scanner silently ignores
# ("sonar.sources and sonar.tests properties are not supported... use sonar.exclusions,
# sonar.inclusions, sonar.test.exclusions, and sonar.test.inclusions"), and fixtures.ts stayed
# misclassified on main after that PR merged green. ci.yml now passes it as sonar.test.inclusions
# instead, the property the scanner's own warning names as supported.

TEST_PATHS=src/backend/Tests/**,src/frontend/tests/**

SONAR_EXCLUSIONS=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/storybook-static/**,src/frontend/comps/**

SONAR_COVERAGE_EXCLUSIONS=**/Migrations/**,**/*.stories.tsx,.github/**,perf/baseline.py,src/backend/Infrastructure/Identity/DevDataSeeder.cs,src/frontend/vitest.setup.ts,${TEST_PATHS}

SONAR_CPD_EXCLUSIONS=**/Migrations/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,${TEST_PATHS},src/frontend/src/i18n/config.ts

SONAR_TEST_PATHS=${TEST_PATHS}
