name: mots-supplier-portal

# NFR-SEC-007 / yaml:S2068. Credentials are read from the environment with a dev-only default,
# so this file never has to be edited to carry a real one. The defaults below are for the local
# stack on a developer machine only - they are deliberately weak and well-known.
#
# There is no production or staging compose file in this repository (verified 2026-08-28), and
# production is NOT deployed from this file. When a real environment is built it must supply
# these via a secret store; the wiring for that does not exist yet and is tracked as a
# deployment-readiness item, not an assumption.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mots_supplier_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 localhost 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  # Task #35: local SMTP catcher for dev/test. Accepts any mail with no auth (never a real
  # destination), web UI at :8025 to read what was actually sent. Real environments configure
  # Smtp:Host/User/Password to a real provider via appsettings/secret store - the same "the
  # defaults here are dev-only, this file never carries a real credential" rule as the rest of
  # this file applies here too, trivially, since MailHog has no credential to carry at all.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
  clamav-data:
