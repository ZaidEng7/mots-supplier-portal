# The local development stack: PostgreSQL, MinIO, ClamAV and a mail catcher.
#
# NFR-SEC-007 and yaml:S2068. Every credential here is read from the environment with a dev-only
# default, so this file never has to be edited to carry a real one. The defaults are for the local
# stack on a developer machine and are deliberately weak and well known.
#
# There is no production or staging compose file in this repository, verified 2026-08-28, and
# production is NOT deployed from this file. A real environment must supply these through a secret
# store. That wiring does not exist yet and is tracked as a deployment-readiness item rather than
# assumed to be in place.
#
# minio is pinned to quay.io. Docker Hub no longer serves minio/minio at all, a change that also
# had to be made in PostgresApiFixture.cs, where it took CI down.
#
# mailhog is Task #35: an SMTP catcher for development and test. It accepts any mail with no
# authentication and is never a real destination, with a web interface on :8025 for reading what
# was actually sent. Real environments point Smtp:Host, Smtp:User and Smtp:Password at a provider
# through appsettings or the secret store. The dev-only rule above applies to it trivially, since
# MailHog has no credential to carry in the first place.

name: mots-supplier-portal

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mots_supplier_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 localhost 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
  clamav-data:
